name: hub_sweep

# Appends one status snapshot to status_log.jsonl for the HuB dashboard
# (https://philipdallen.github.io/HuB/). See docs/HUB_STATUS_LOG.md.
#
# This repo is the writer; HuB only reads. Nothing here writes to any other
# repo — the log is this repo's own file, on this repo's own branch, so there
# is no cross-repo write surface to conflict on.

on:
  schedule:
    # Every 30 minutes. GitHub may delay scheduled runs under load; the sweep
    # is idempotent, so a late or doubled run is harmless.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

# Needed to write the snapshot back to the branch (contents: write for the
# push; issues: read for the flow counts).
permissions:
  contents: write
  issues: read

concurrency:
  # Never let two sweeps race on the same branch: the log is append-only and a
  # lost update would silently drop a snapshot.
  group: hub_sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Append status snapshot
        env:
          # The default token is enough: issues are read from this repo only.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tooling/hub_sweep.py --repo ${{ github.repository }} --token-env GITHUB_TOKEN

      - name: Commit and push if the log changed
        run: |
          set -e
          # Stage first, then test the index. `git diff --quiet -- <path>` is NOT
          # sufficient here: it ignores untracked files, so on a repo where the
          # sweep has just *created* status_log.jsonl it reports "no change" and
          # the file is silently discarded. `git diff --cached` after `git add`
          # detects both creation and modification.
          git add -- status_log.jsonl
          if git diff --cached --quiet -- status_log.jsonl; then
            echo "no change; nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(hub): status snapshot [skip ci]"

          # Multiple agents push to dev continuously, so a single push can be
          # rejected as non-fast-forward. Rebase and retry, per the repo's own
          # protocol (docs/MULTI_AGENT_WORKFLOW.md): "On push rejection
          # (non-fast-forward): git pull --rebase origin dev ... push again."
          # Never force-push -- the protocol forbids it because it would destroy
          # a sibling's committed work.
          for attempt in 1 2 3 4 5; do
            if git push origin dev; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected; rebasing onto origin/dev (attempt $attempt)"
            git pull --rebase origin dev
          done
          echo "push still rejected after 5 attempts" >&2
          exit 1